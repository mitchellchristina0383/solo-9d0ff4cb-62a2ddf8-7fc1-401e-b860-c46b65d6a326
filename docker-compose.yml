services:
  water-service:
    build: .
    image: water-usage-service:latest
    container_name: water-usage-service
    ports:
      - "8000:8000"
    environment:
      WATER_DATA_DIR: /data
    volumes:
      - water-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  water-data:
